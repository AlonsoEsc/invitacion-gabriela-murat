services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: gabriela_murad
      MYSQL_USER: boda
      MYSQL_PASSWORD: local-docker-password
      NODE_ENV: production
    ports:
      - "8080:4001"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: gabriela_murad
      MYSQL_USER: boda
      MYSQL_PASSWORD: local-docker-password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
