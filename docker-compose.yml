services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/gabriela_murad
      NODE_ENV: production
    ports:
      - "8080:4001"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
