name: Publicar backend RSVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: functions
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publicar funciones y reglas
        run: npx --yes firebase-tools deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --only functions,firestore:rules,firestore:indexes
        env:
          COUPLE_EMAILS: ${{ secrets.COUPLE_EMAILS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          PUBLIC_SITE_URL: https://alonsoesc.github.io/invitacion-gabriela-murat/
          RSVP_DEADLINE: 2026-12-02T05:59:59.000Z
